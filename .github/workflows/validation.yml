name: Validate public Tiny Family test package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Validation only; this workflow does not release, publish to HACS, or change
# repository visibility. Never upload real Home Assistant configuration.
permissions:
  contents: read

jobs:
  package:
    name: Python, JS and integration metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Regression tests (sensor threads and automation contexts)
        run: python -m unittest discover -s tests -p "test_runtime_safety.py" -v
      - name: Test persistent timeline archive
        run: python -m unittest discover -s tests -p "test_timeline_archive.py" -v
      - name: Map matching regression tests
        run: python -m unittest discover -s tests -p "test_map_matching.py" -v
      - name: Tiny Neon mobile layout regression tests
        run: python -m unittest discover -s tests -p "test_mobile_experience.py" -v
      - name: Verify integration-owned alarms and safe migration
        run: python -m unittest discover -s tests -p "test_managed_alarms.py" -v
      - name: One-time Tiny Family migration test
        run: python -m unittest discover -s tests -p "test_one_time_migration.py" -v
      - name: Danish speaker message regression tests
        run: python -m unittest discover -s tests -p "test_speaker_messages.py" -v
      - name: Embedded road engine regression tests
        run: python -m unittest discover -s tests -p "test_road_engine.py" -v
      - name: Phone sensor selection and GPS-drift regression tests
        run: python -m unittest discover -s tests -p "test_phone_sensors_and_gps.py" -v
      - name: Admin-only place and timeline deletion tests
        run: python -m unittest discover -s tests -p "test_admin_place_permissions.py" -v
      - name: Independent destinations inside drawn zones
        run: python -m unittest discover -s tests -p "test_zone_destinations.py" -v
      - name: Historical destination prediction regression tests
        run: python -m unittest discover -s tests -p "test_historical_destination_prediction.py" -v
      - name: Default-on embedded road engine and admin override tests
        run: python -m unittest discover -s tests -p "test_default_road_matching.py" -v
      - name: Verify publishable integration
        run: |
          python -m compileall -q custom_components/tiny_family
          node --check custom_components/tiny_family/frontend/tiny-family-panel.js
          node --check custom_components/tiny_family/frontend/tiny-family-card.js
          node tests/test_timeline_replay.js
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path("custom_components/tiny_family/manifest.json").read_text())
          hacs=json.loads(Path("hacs.json").read_text())
          assert meta["domain"] == "tiny_family"
          assert meta["version"] == "0.8.8"
          assert hacs["name"] == "Tiny Family"
          assert Path("custom_components/tiny_family/device_binding.py").is_file()
          assert Path("custom_components/tiny_family/frontend/leaflet/LICENSE").is_file()
          print("Tiny Family 0.8.8 public package verified")
          PY

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Official HACS validator for public repositories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
