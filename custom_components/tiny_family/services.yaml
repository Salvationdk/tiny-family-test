get_day_summary:
  name: Hent dagoversigt
  description: Returnerer distance, ophold og max-fart for en person i dag.
  fields:
    person:
      name: Person
      description: Person entity, e.g. person.john_doe
      required: true
      selector:
        entity:
          domain: person

evaluate_location:
  name: Undersøg position i polygoner
  description: >-
    Læser Tiny Familys polygonmotor fra en HA-automation eller et YAML-script.
    Returnerer alle matchende polygoner; kan også beregne luftlinjeafstand og
    et forsigtigt ETA-skøn. Ingen persons private position læses. Brug
    response_variable til resultatet.
  fields:
    latitude:
      name: Breddegrad
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: 0.000001
          mode: box
    longitude:
      name: Længdegrad
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: 0.000001
          mode: box
    target_latitude:
      name: Destinationens breddegrad (valgfri)
      selector:
        number:
          min: -90
          max: 90
          step: 0.000001
          mode: box
    target_longitude:
      name: Destinationens længdegrad (valgfri)
      selector:
        number:
          min: -180
          max: 180
          step: 0.000001
          mode: box
    speed_kmh:
      name: Hastighed i km/t (valgfri)
      description: Kræver destinationskoordinater; ETA er et skøn, ikke vej-navigation.
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          mode: box

log_message:
  name: Gem besked i historik
  description: Gemmer en sendt besked i beskedhistorikken.
  fields:
    fra:
      name: Afsender
      description: Navn på afsenderen.
      required: true
      selector:
        text:
    til:
      name: Modtager
      description: Navn på modtageren.
      required: true
      selector:
        text:
    tekst:
      name: Tekst
      description: Beskedens indhold.
      required: true
      selector:
        text:
          multiline: true

log_notification:
  name: Gem systembesked i historik
  description: Gemmer en systemnotifikation (SOS, ankomst, batteri, fart, ture) i historikken.
  fields:
    kategori:
      name: Kategori
      description: F.eks. SOS, Ankomst, Lavt batteri, Fartalarm, Tur afsluttet.
      required: true
      selector:
        text:
    tekst:
      name: Tekst
      description: Notifikationens indhold.
      required: true
      selector:
        text:
          multiline: true

create_zone_from_suggestion:
  name: Opret zone fra forslag
  description: Opretter en zone ud fra koordinater og navn.
  fields:
    navn:
      name: Navn
      description: Zonens navn.
      required: true
      selector:
        text:
    lat:
      name: Breddegrad
      required: true
      selector:
        number:
          mode: box
    lon:
      name: Længdegrad
      required: true
      selector:
        number:
          mode: box
    radius:
      name: Radius
      required: false
      default: 25
      selector:
        number:
          min: 10
          max: 200
          mode: box
          unit_of_measurement: m

label_place:
  name: Navngiv ukendt sted
  description: Navngiver et lært sted så det bliver genkendeligt.
  fields:
    person:
      name: Person
      required: true
      selector:
        entity:
          domain: person
    lat:
      name: Breddegrad
      required: true
      selector:
        number:
          mode: box
    lon:
      name: Længdegrad
      required: true
      selector:
        number:
          mode: box
    label:
      name: Navn
      required: true
      selector:
        text:

save_place_as_zone:
