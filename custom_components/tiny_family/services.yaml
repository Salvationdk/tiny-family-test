      name: Breddegrad
      required: true
      selector:
        number:
          mode: box
    lon:
      name: Længdegrad
      required: true
      selector:
        number:
          mode: box
    navn:
      name: Navn
      required: true
      selector:
        text:
    radius:
      name: Radius
      required: false
      default: 25
      selector:
        number:
          min: 10
          max: 200
          mode: box
